<!--
  부유식 데이터센터 스크롤 3D (v0.42, 2026-11-15) — 사진은 ./photos/*.jpg (없으면 칸이 숨겨짐) — 세 기사 통합판. 모델 ./models/*.glb (없는 모델은 코드 임시 모형) — 원고: 주末머니 FDC편

  - 글자·숫자·카메라는 전부 아래 CONFIG 한 곳에서 바꾼다. (주말머니 원고 확정 후 교체)
-->
<html lang="ko">
<head>

<title>데이터센터를 둘러싼 세 가지 변수 | 아시아경제 비주얼뉴스</title>

<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#070b10;color:#eef3f6;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;overflow-x:hidden}

/* 고정 레이어 */
#stage{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:0;background:radial-gradient(120% 90% at 50% 100%,#0f2430 0%,#061018 60%)}
#stage canvas{display:block;width:100%;height:100%}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(7,11,16,.55) 0%,rgba(7,11,16,0) 22%,rgba(7,11,16,0) 70%,rgba(7,11,16,.6) 100%)}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;opacity:0;transition:opacity .35s ease;will-change:transform}
.lbl i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(94,242,200,.35),0 0 14px #5ef2c8}
.lbl b{position:absolute;left:0;bottom:16px;width:1px;height:26px;background:#5ef2c8}

.lbl.cy i{box-shadow:0 0 0 4px rgba(111,183,255,.35),0 0 14px #6fb7ff}
.lbl.cy b{background:#6fb7ff}.lbl.cy span{border-color:#6fb7ff}
.lbl.rd i{box-shadow:0 0 0 4px rgba(255,122,89,.35),0 0 14px #ff7a59}
.lbl.rd b{background:#ff7a59}.lbl.rd span{border-color:#ff7a59}

/* 진행 표시 */
#bar{position:fixed;left:0;top:0;z-index:6;height:3px;width:100%;background:rgba(255,255,255,.08)}
#bar u{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ef2c8,#6fb7ff)}
#rail{position:fixed;z-index:5;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;opacity:0;transition:opacity .4s}
#rail.on{opacity:1}
#rail a{display:flex;align-items:center;justify-content:flex-end;gap:8px;text-decoration:none;color:rgba(238,243,246,.5);font-size:11px;font-weight:700;cursor:pointer}

#rail a:before{content:"";order:2;width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(238,243,246,.55)}
#rail a.on{color:#fff}#rail a.on em{opacity:1}
#rail a.on:before{background:#5ef2c8;border-color:#5ef2c8;box-shadow:0 0 10px #5ef2c8}
@media(max-width:819px){#rail{display:none}}

/* 스크롤 본문 */
#story{position:relative;z-index:4}
.step{position:relative;height:calc(var(--h,160) * 1vh);display:flex;align-items:center;padding:0 clamp(16px,6vw,96px)}
.step.r{justify-content:flex-end}
.step.c{justify-content:center;text-align:center}
.cap{max-width:440px;padding:22px 24px 24px;background:rgba(9,15,21,.86);border-left:3px solid var(--ac,#5ef2c8);border-radius:2px;box-shadow:0 16px 50px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cap .eb{display:block;margin-bottom:10px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ac,#5ef2c8)}
.cap h2{margin:0 0 12px;font-size:clamp(24px,2.6vw,34px);font-weight:900;line-height:1.25;letter-spacing:-.03em}
.cap p{margin:0;font-size:clamp(16px,1.3vw,18px);line-height:1.75;letter-spacing:-.01em;color:#dbe4ea}
.cap p+p{margin-top:14px}
.cap p b{font-weight:700;color:#fff;background:linear-gradient(transparent 60%,rgba(255,122,89,.5) 0)}
.cap .tmp{margin-top:14px;font-size:12px;color:#8fa1ad}
.cap ol{margin:14px 0 0;padding:0;list-style:none;text-align:left}
.cap ol li{display:flex;gap:12px;align-items:baseline;padding:12px 0;border-top:1px solid rgba(255,255,255,.12);font-size:16px;line-height:1.6;color:#dbe4ea}
.cap ol li b{flex:none;color:#5ef2c8;font-weight:900;font-size:16px;min-width:4.4em}
.step.hero .cap{max-width:720px;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0}
.step.hero h1{margin:0 0 18px;font-size:clamp(38px,6.4vw,84px);font-weight:900;line-height:1.12;letter-spacing:-.045em;text-shadow:0 4px 30px rgba(0,0,0,.7)}
.step.hero p{font-size:clamp(17px,1.6vw,21px);color:#eef3f6;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.chip{display:inline-flex;gap:10px;align-items:baseline;margin-top:22px;padding:8px 14px;border:1px solid rgba(255,255,255,.28);border-radius:99px;background:rgba(8,14,20,.6);font-size:13px;color:#c9d4db}
.chip b{font-size:17px;color:#fff}.chip i{font-style:normal;font-weight:700}
.chip i.up{color:#ff7a59}.chip i.dn{color:#5aa8ff}
.hint{margin-top:34px;font-size:12px;letter-spacing:.2em;color:#9fb0bb;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.idx{display:block;width:100%;height:auto;margin-top:16px}
.credit{font-size:12px;line-height:1.7;color:#8fa1ad;margin-top:18px;text-align:left}
#nogl{display:none;position:fixed;z-index:3;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 12px;font-size:12px;color:#c9d4db;background:rgba(8,14,20,.85);border:1px solid rgba(255,255,255,.2);border-radius:4px}
.no-webgl #nogl{display:block}
@media(max-width:819px){
  .step,.step.r{justify-content:center}

}

.bars{margin-top:16px}
.bars .bl{display:block;margin:14px 0 8px;font-size:13px;font-weight:700;color:#9fb0bb}
.bars .br{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.bars .br em{flex:none;width:3.4em;font-style:normal;color:#dbe4ea}
.bars .br .tr{flex:1;height:14px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.bars .br .tr i{display:block;height:100%;background:#6b7c88}
.bars .br.hi .tr i{background:#5ef2c8}
.bars .br b{flex:none;min-width:6.6em;text-align:right;font-weight:700;color:#fff}
.bars .br.hi b{color:#5ef2c8}
.chk{display:inline-block;margin-top:12px;padding:3px 8px;font-size:12px;font-weight:700;color:#07100d;background:#ffd166;border-radius:3px}
.step.fin{height:auto;min-height:calc(var(--h,160) * 1vh);flex-direction:column;justify-content:center;gap:34px;padding-top:30vh;padding-bottom:16vh}
.relwrap{width:100%;max-width:1120px;pointer-events:auto;text-align:left}
.relh{display:block;margin-bottom:14px;font-size:14px;font-weight:700;letter-spacing:.14em;color:#5ef2c8;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.relgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.rcard{display:flex;flex-direction:column;background:rgba(9,15,21,.92);border-radius:4px;overflow:hidden;text-decoration:none;color:#eef3f6;box-shadow:0 16px 50px rgba(0,0,0,.45);transition:transform .2s}
.rcard:hover{transform:translateY(-4px)}
.rcard img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#fff}
.rtx{display:flex;flex-direction:column;flex:1;padding:14px 16px 18px}
.rtx em{font-style:normal;font-size:12px;font-weight:700;letter-spacing:.1em;color:#5ef2c8;margin-bottom:6px}
.rtx strong{font-size:17px;line-height:1.45;font-weight:700;letter-spacing:-.02em;margin-bottom:16px}
.rbtn{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;background:#5ef2c8;color:#08131a;font-size:13px;font-weight:700}
@media(max-width:819px){
  .relgrid{grid-template-columns:1fr;gap:10px}
  .rcard{flex-direction:row}
  .rcard img{width:112px;flex:none;aspect-ratio:auto;height:auto;min-height:104px}
  .rtx{padding:12px 14px}.rtx strong{font-size:15px;margin-bottom:10px}
  .rbtn{padding:0;background:none;color:#5ef2c8;font-size:12px}
}
.bsrc{display:block;margin-top:10px;font-size:12px;color:#93a3ae}
.cap.pcard .ph .two.three img{height:150px}
@media(max-width:819px){.cap.pcard .ph .two.three{flex-direction:column}.cap.pcard .ph .two.three img{width:100%;height:124px}}
.rel{margin-top:20px;text-align:left;border-top:1px solid rgba(255,255,255,.14);padding-top:14px}
.rel span{display:block;margin-bottom:8px;font-size:12px;font-weight:700;letter-spacing:.1em;color:#5ef2c8}
.rel a{display:block;padding:7px 0;font-size:15px;line-height:1.5;color:#eef3f6;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.08)}
.rel a:hover{color:#5ef2c8}
@media(max-width:819px){.cap p{font-size:15.5px;line-height:1.7}.cap h2{font-size:22px}.cap ol li{font-size:15px;padding:9px 0}}
.ch-art{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;background:center/cover no-repeat;will-change:opacity}
.ch-art:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(4,12,19,.62),rgba(4,12,19,.3) 60%,rgba(4,12,19,.5))}
.ch-art span{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:1;padding:5px 8px;background:rgba(4,12,19,.75);color:#e1eaf0;font-size:11px}
#lead-art{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;background:68% center/cover no-repeat}
#lead-art:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,12,19,.83),rgba(4,12,19,.34) 52%,transparent 85%),linear-gradient(0deg,rgba(4,12,19,.55),transparent 45%)}
html.has-cover #lead-art{opacity:1}
#lead-credit{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:1;padding:5px 8px;background:rgba(4,12,19,.75);color:#e1eaf0;font-size:11px}
.step.hero{justify-content:flex-start;text-align:left}
.step.hero p b{background:none;color:#7ff0d6;font-weight:800;white-space:nowrap}
@media(max-width:819px){br.pc{display:none}}
.step.hero .cap{max-width:570px}
.step.hero .eb{letter-spacing:.08em;color:#a3ebe2}
.cap{border-radius:6px;background:rgba(9,15,21,.9)}
@media(max-width:819px){#lead-art{background-position:72% center}#lead-art:after{background:linear-gradient(180deg,rgba(4,12,19,.76),rgba(4,12,19,.2) 62%,rgba(4,12,19,.52))}.step.hero{align-items:flex-start;padding-top:20vh}.step.hero .cap{max-width:380px}}
.step.chap .cap{max-width:860px;width:100%;background:radial-gradient(closest-side,rgba(4,12,19,.82),rgba(4,12,19,.5) 60%,rgba(4,12,19,0));border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:70px 30px;margin-top:0;text-align:center}
.step.chap .cn{display:inline-block;margin-bottom:16px;padding:6px 16px;border:1px solid var(--ac,#5ef2c8);border-radius:99px;font-size:14px;font-weight:700;letter-spacing:.18em;color:var(--ac,#5ef2c8);background:rgba(6,16,24,.55)}
.step.chap h2{font-size:clamp(34px,5.4vw,68px);letter-spacing:-.045em;text-shadow:0 4px 30px rgba(0,0,0,.75)}
.cap .aft{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);text-align:left}
.cap.hasph{max-width:500px}
.cap .ph{margin:-22px -24px 18px;overflow:hidden;border-radius:6px 6px 0 0}
.cap .ph img{display:block;width:100%;height:230px;object-fit:cover}
.cap .ph figcaption{padding:8px 24px 0;font-size:12.5px;line-height:1.5;color:#aebcc6}
.cap .ph figcaption em{display:block;font-style:normal;color:#7f909c}
.cap .ph figcaption a{color:#9fb3c2;text-decoration:underline}

.cap .ph .two{display:flex;gap:2px}.cap .ph .two img{width:50%}.cap .ph .two.three img{width:33.34%}
/* 사진이 있는 구간: 글 카드가 먼저 지나가고, 더 내리면 사진 카드가 따로 나온다 */
.step.ph2{flex-direction:column;justify-content:center;gap:58vh;height:calc((var(--h,160) + 125) * 1vh)}
.step.solo>.cap:not(.pcard){display:none}.step.ph2.solo{height:calc(var(--h,160) * 1vh)}
.step.ph2.l{align-items:flex-start}.step.ph2.r{align-items:flex-end}
.cap.pcard{max-width:560px;width:100%;padding:0;border-left:0;border-radius:6px;overflow:hidden}
.cap.pcard .ph{margin:0;border-radius:0}

.cap.pcard .ph figcaption{padding:12px 18px 15px;font-size:15px;line-height:1.55;color:#e3eaef}
.cap.pcard .ph figcaption em{margin-top:4px;font-size:12px;color:#8496a2}
@media(max-width:819px){
  .step.ph2,.step.ph2.l,.step.ph2.r{align-items:center;gap:46vh}
  .cap.pcard{margin-top:0}
  .cap.pcard .ph{margin:0}
  .cap.pcard .ph img{height:230px}

}
.cap .ph .two.stack{flex-direction:column;background:#fff}

<body>
<div id="bar"><u></u></div>
<div id="stage"></div>
<div id="lead-art" aria-hidden="true"><span id="lead-credit">AI 생성 콘셉트 이미지</span></div>
<div id="shade"></div>
<div id="labels"></div>
<nav id="rail" aria-label="구간"></nav>
<main id="story"></main>
<div id="nogl">3D를 표시할 수 없는 환경입니다. 본문은 그대로 읽을 수 있습니다.</div>

<script src="./three-bundle.js"></script>
<script>
(function(){
"use strict";

/* =====================================================================
   CONFIG — 여기만 고치면 된다
   - market : 첫 화면 시세 칩 (없으면 null)
   - bars   : 막대 비교 [{label,rows:[[이름,값,표기,강조]]}], check=노란 확인 딱지
   - related: 맨 끝 관련 기사 [[제목,URL]] (자사 기사만)
   - steps  : 구간. h=스크롤 길이(vh), side=l/r/c, ac=강조색,
              cam=[{p:[카메라 위치], t:[바라보는 곳]}] (여러 개면 구간 안에서 순서대로 이동)
              labels=[{at:[x,y,z], text, c:''|'cy'|'rd', k:몇 번째 cam에서만 보일지(생략 가능)}]
   ===================================================================== */
var CONFIG={
  market:null,
  steps:[
    {id:"hero",nav:"처음",h:115,side:"c",hero:true,
     eb:"주末머니 · 비주얼뉴스",
     title:"데이터센터가 막히자<br>벌어진 세 가지",
     body:["미국 중간선거가 끝난 뒤 데이터센터 짓기가 까다로워졌어요. 그 틈에서 시장이 찾아낸 길 세 갈래를 따라가 봤습니다."],
     cam:[{p:[-92,62,64],t:[15,0,-15]}]},

    /* ---------- 발단 ---------- */
    {id:"bill",nav:"발단",h:180,side:"l",ac:"#ff7a59",
     eb:"발단",
     title:"챗봇은 반갑지만, 전기료는 다른 얘기",
     body:["챗봇의 똑똑한 답변은 반갑습니다. 그런데 그 뒤에 선 거대한 데이터센터가 우리 집 전기료를 올린다면 얘기가 달라집니다.",
           "전기를 잔뜩 쓰는 시설이 들어오는데 왜 주민까지 비용을 나눠 내야 하느냐. 미국 중간선거에서 불거진 데이터센터 반대 여론은 이 물음에서 나왔습니다."],
     labels:[{at:[-160,9,45],text:"주택가"},{at:[-30,16,0],text:"데이터센터",c:"cy"}],
     cam:[{p:[-214,10,92],t:[-120,9,18]}]},

    {id:"issue",h:180,side:"r",ac:"#ff7a59",
     eb:"쟁점",
     title:"따질 것은 전기와 물입니다",
     body:["선거는 민주당의 압승, 이른바 '블루웨이브'로 끝났습니다. 한국투자증권 김건우 연구원은 데이터센터 건설이 어려워질 것으로 봤습니다.",
           "규제를 다시 짜면서 다뤄질 문제로는 두 가지가 꼽힙니다. 지역의 물을 얼마나 쓰게 할지, 오른 전기요금은 누가 책임질지입니다."],
     labels:[{at:[-56,9,0],text:"전기 · 변전 설비"},{at:[-12,24,5],text:"물 · 냉각 설비",c:"cy"},{at:[-42,8,27],text:"물탱크",c:"cy"}],
     cam:[{p:[-108,34,58],t:[-6,4,0]}]},

    {id:"market",h:180,side:"l",ac:"#ff7a59",
     eb:"시장 반응",
     title:"공사가 꼬이자 주가가 먼저 빠졌습니다",
     body:["데이터센터가 늦어지면 그 안에 들어갈 반도체 주문도 밀립니다. 선거 직후 코스피는 하루에 5% 넘게 떨어졌고, 이튿날에는 장중 5000선을 내줬습니다.",
           "그 뒤 증권가 보고서는 세 방향으로 갈렸습니다. 전기를 직접 만드는 쪽, 반도체를 다시 따져보는 쪽, 아예 땅을 떠나는 쪽입니다."],
     labels:[{at:[82,13,0],text:"멈춘 공사",c:"rd"}],

function capacitySVG(){
  // 미국 데이터센터 설치 용량(GW). 2010~2025 실적, 2026~2035 전망. 막대 높이는 보고서 그림에서 읽은 근삿값.
  var v=[4,5,5,6,7,8,9,10,12,14,17,21,23,27,38,48,56,70,86,102,118,135,153,167,181,193];
  var W=560,H=392,x0=46,x1=532,yb=236,yt=30,n=v.length,bw=(x1-x0)/n,i,s;
  function Y(g){return yb-(yb-yt)*g/200;}
  s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="미국 데이터센터 설치 용량과 규제 영향권" style="display:block;width:100%;height:auto;background:#0b151d">';
  var gs=[0,50,100,150,200];
  for(i=0;i<gs.length;i++){
    s+='<line x1="'+x0+'" y1="'+Y(gs[i])+'" x2="'+x1+'" y2="'+Y(gs[i])+'" stroke="rgba(255,255,255,'+(i?0.08:0.3)+')"/>';
    s+='<text x="'+(x0-8)+'" y="'+(Y(gs[i])+4)+'" text-anchor="end" font-size="12" fill="#8fa1ad">'+gs[i]+'</text>';
  }
  s+='<text x="'+(x0-8)+'" y="18" text-anchor="end" font-size="12" fill="#8fa1ad">GW</text>';
  for(i=0;i<n;i++){
    var x=x0+i*bw+bw*0.16,fc=i<=15?"#7f8c96":"#f0a95a";
    s+='<rect x="'+x.toFixed(1)+'" y="'+Y(v[i]).toFixed(1)+'" width="'+(bw*0.68).toFixed(1)+'" height="'+(yb-Y(v[i])).toFixed(1)+'" fill="'+fc+'"/>';
  }
  var xs=[[0,"2010"],[5,"2015"],[10,"2020"],[15,"2025"],[20,"2030"],[25,"2035"]];
  for(i=0;i<xs.length;i++)s+='<text x="'+(x0+(xs[i][0]+0.5)*bw).toFixed(1)+'" y="'+(yb+18)+'" text-anchor="middle" font-size="12" fill="#8fa1ad">'+xs[i][1]+'</text>';
  s+='<text x="'+x1+'" y="22" text-anchor="end" font-size="15" font-weight="900" fill="#fff">2035년까지 150GW 추가</text>';
  s+='<rect x="'+x0+'" y="'+(yb+34)+'" width="10" height="10" fill="#7f8c96"/><text x="'+(x0+15)+'" y="'+(yb+43)+'" font-size="12" fill="#c3ced6">실적</text>';
  s+='<rect x="'+(x0+52)+'" y="'+(yb+34)+'" width="10" height="10" fill="#f0a95a"/><text x="'+(x0+67)+'" y="'+(yb+43)+'" font-size="12" fill="#c3ced6">전망</text>';
  // 새로 생길 150GW 가운데 13GW
  var by=yb+70,bh=26,full=x1-x0,part=full*13/150;
  s+='<text x="'+x0+'" y="'+(by-8)+'" font-size="13" font-weight="700" fill="#e3eaef">새로 생길 150GW</text>';
  s+='<rect x="'+x0+'" y="'+by+'" width="'+full+'" height="'+bh+'" fill="#f0a95a"/>';
  s+='<rect x="'+x0+'" y="'+by+'" width="'+part.toFixed(1)+'" height="'+bh+'" fill="#ff5a3c"/>';
  s+='<line x1="'+(x0+part/2).toFixed(1)+'" y1="'+(by+bh)+'" x2="'+(x0+part/2).toFixed(1)+'" y2="'+(by+bh+10)+'" stroke="#ff7a59"/>';

function demandSVG(){
  // 하루 전력 수요(회색)와 데이터센터 사용량(민트) 개념도
  var W=560,H=300,x0=44,x1=536,y0=250,i,p="",q="";
  function X(h){return x0+(x1-x0)*h/24;}
  function D(h){return 0.42+0.2*Math.exp(-Math.pow((h-9)/3.2,2))+0.5*Math.exp(-Math.pow((h-18.5)/2.4,2));}
  function U(h){var d=Math.max(0,1-Math.abs(h-18.5)/2.6);return 0.5-0.26*(d>0?Math.min(1,d*1.8):0);}
  for(i=0;i<=96;i++){var h=i/4;p+=(i?"L":"M")+X(h).toFixed(1)+" "+(y0-D(h)*190).toFixed(1);q+=(i?"L":"M")+X(h).toFixed(1)+" "+(y0-U(h)*190).toFixed(1);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="전력 수요가 몰리는 시간에 데이터센터가 사용량을 줄이는 개념도" style="display:block;width:100%;height:auto;background:#0b151d">';
  s+='<rect x="'+X(16)+'" y="26" width="'+(X(21)-X(16))+'" height="'+(y0-26)+'" fill="rgba(255,122,89,.14)"/>';
  s+='<text x="'+X(18.5)+'" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#ff9d84">전기를 많이 쓰는 시간</text>';
  s+='<path d="'+p+'L'+x1+' '+y0+'L'+x0+' '+y0+'Z" fill="rgba(160,178,190,.16)"/><path d="'+p+'" fill="none" stroke="#9fb0bb" stroke-width="2"/>';
  s+='<path d="'+q+'" fill="none" stroke="#5ef2c8" stroke-width="3.5" stroke-linejoin="round"/>';
  s+='<line x1="'+x0+'" y1="'+y0+'" x2="'+x1+'" y2="'+y0+'" stroke="#55687a"/>';
  var ticks=[0,6,12,18,24];
  for(i=0;i<ticks.length;i++)s+='<text x="'+X(ticks[i])+'" y="'+(y0+20)+'" text-anchor="middle" font-size="13" fill="#8fa1ad">'+ticks[i]+'시</text>';
  s+='<text x="'+X(8.6)+'" y="'+(y0-D(9)*190-12)+'" text-anchor="middle" font-size="14" fill="#c3ced6">지역 전체 전력 수요</text>';
  s+='<text x="'+X(3.2)+'" y="'+(y0-0.5*190-12)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#5ef2c8">데이터센터 사용량</text>';
  s+='<text x="'+X(18.5)+'" y="'+(y0-0.24*190+24)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#5ef2c8">잠시 줄임</text>';
  return s+"</svg>";
}
function chartSVG(){
  var d=CONFIG.index,W=380,H=150,pl=8,pr=8,pt=26,pb=30,i,min=1e9,max=-1e9;
  for(i=0;i<d.length;i++){if(d[i].v<min)min=d[i].v;if(d[i].v>max)max=d[i].v;}
  var pad=(max-min)*0.12;min-=pad;max+=pad;
  var pts=[],s='<svg class="idx" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="코스피 흐름">';
  for(i=0;i<d.length;i++){
    var x=pl+(W-pl-pr)*((i+0.5)/d.length),y=pt+(H-pt-pb)*(1-(d[i].v-min)/(max-min));
    pts.push([x,y]);
  }
  var path="";
  for(i=0;i<pts.length;i++)path+=(i?"L":"M")+pts[i][0].toFixed(1)+" "+pts[i][1].toFixed(1);
  s+='<path d="'+path+'" fill="none" stroke="#ff6b5e" stroke-width="2.5" stroke-linejoin="round"/>';
  for(i=0;i<pts.length;i++){
    var m=d[i].mark;
    s+='<circle cx="'+pts[i][0].toFixed(1)+'" cy="'+pts[i][1].toFixed(1)+'" r="'+(m?5.5:3.5)+'" fill="'+(m?"#ff6b5e":"#0a1016")+'" stroke="#ff6b5e" stroke-width="2"/>';
    s+='<text x="'+pts[i][0].toFixed(1)+'" y="'+(pts[i][1]-11).toFixed(1)+'" text-anchor="middle" font-size="'+(m?15:12.5)+'" font-weight="'+(m?900:700)+'" fill="#fff">'+Math.round(d[i].v)+'</text>';
    s+='<text x="'+pts[i][0].toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11.5" fill="#9fb0bb">'+d[i].d+'</text>';
  }
  return s+"</svg>";
}

var gltfLoader=new THREE.GLTFLoader();
function loadModel(name,cb){
  var emb=window.__MODELS&&window.__MODELS[name];
  function done(g){
    g.scene.traverse(function(o){
      if(o.isMesh&&o.material){
        var n=o.material.name;
        if(n==="glass"){o.material.emissive=new THREE.Color(0xffc98a);o.material.emissiveIntensity=1.1;}
        if(n==="lamp"){o.material.emissive=new THREE.Color(0xff4a30);o.material.emissiveIntensity=2.2;}
        if(n==="yellow"){o.material.emissive=new THREE.Color(0x6b3a05);o.material.emissiveIntensity=0.45;}
        o.material.roughness=n==="glass"?0.35:0.61;o.material.metalness=0.16;
      }
    });
    cb(g.scene);
  }
  if(emb){
    var bin=atob(emb),u=new Uint8Array(bin.length),i;for(i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    gltfLoader.parse(u.buffer,"",done,function(e){console.error("model",name,e);});
  }else gltfLoader.load("./models/"+name+".glb",done,undefined,function(e){console.error("model",name,e);});
}

  if(window.__MODELS&&!hasModel(name)){for(var i=0;i<list.length;i++)fallback(list[i],i);return;}
  var done=false;
  function fb(){if(done)return;done=true;for(var i=0;i<list.length;i++)fallback(list[i],i);}
  var emb=hasModel(name);
  if(!emb){
    gltfLoader.load("./models/"+name+".glb",function(g){
      if(done)return;done=true;tune(g.scene);
      for(var i=0;i<list.length;i++){var c=i?g.scene.clone(true):g.scene,p=list[i];c.position.set(p[0],p[1],p[2]);c.rotation.y=p[3]||0;if(p[4])c.scale.setScalar(p[4]);scene.add(c);if(after)after(c,i);}
    },undefined,fb);
  }else place(name,list,after);
}

  root.traverse(function(o){
    if(o.isMesh&&o.material){
      var n=o.material.name;
      if(n==="glass"){o.material.emissive=new THREE.Color(0xffc98a);o.material.emissiveIntensity=1.1;}
      if(n==="lamp"){o.material.emissive=new THREE.Color(0xff4a30);o.material.emissiveIntensity=2.2;}
      if(n==="yellow"){o.material.emissive=new THREE.Color(0x6b3a05);o.material.emissiveIntensity=0.45;}
      o.material.roughness=n==="glass"?0.35:0.61;o.material.metalness=0.16;
    }

  loadModel(name,function(m){

  // 라벨
  var stNow=CONFIG.steps[cur],dimF=(stNow&&stNow.id==="google"&&!reduce)?0.2+0.8*Math.pow(Math.abs(Math.sin(t*0.55)),2):1;
  for(i=0;i<shellMats.length;i++)if(shellMats[i].name==="glass")shellMats[i].emissiveIntensity=1.1*dimF;
  for(i=0;i<labelItems.length;i++){
    var L=labelItems[i],show=L.step===cur&&settle>0.55&&(L.k===undefined||L.k===near.k);
    if(show){
      if(L.node&&!L.found){
        var ob=scene.getObjectByName(L.node);
        if(ob){var bx=new THREE.Box3().setFromObject(ob),ctr=bx.getCenter(new THREE.Vector3());L.at=[ctr.x,bx.max.y,ctr.z];L.found=true;}
      }
      vL.fromArray(L.at).project(camera);
      if(vL.z>1||vL.z<-1)show=false;
      else L.el.style.transform="translate("+((vL.x*0.5+0.5)*W).toFixed(1)+"px,"+((-vL.y*0.5+0.5)*H).toFixed(1)+"px)";
    }
    L.el.style.opacity=show?1:0;
  }
}
resize();
requestAnimationFrame(frame);

// 테스트·임베드용 훅
window.__vn={config:CONFIG,keys:function(){return keys;}};
})();
</script>
